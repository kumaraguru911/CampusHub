apiVersion: v1
kind: ConfigMap
metadata:
  name: campushub-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "campushub-backend"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "campushub-backend:8000"

      - job_name: "campushub-node-exporter"
        static_configs:
          - targets:
              - "campushub-node-exporter:9100"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campushub-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campushub-prometheus
  template:
    metadata:
      labels:
        app: campushub-prometheus
    spec:
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:latest
          ports:
            - containerPort: 9090
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: campushub-prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: campushub-prometheus
spec:
  selector:
    app: campushub-prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP