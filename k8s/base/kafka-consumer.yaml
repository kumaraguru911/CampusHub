apiVersion: apps/v1
kind: Deployment
metadata:
  name: campushub-kafka-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campushub-kafka-consumer
  template:
    metadata:
      labels:
        app: campushub-kafka-consumer
    spec:
      containers:
        - name: kafka-consumer
          image: localhost/campushub-backend:k8s-v4
          imagePullPolicy: Never
          command:
            - python
            - -m
            - app.kafka.consumer
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: campushub-postgres-secret
                  key: DATABASE_URL
            - name: KAFKA_BROKER
              value: "campushub-kafka:9092"
