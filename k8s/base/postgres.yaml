apiVersion: apps/v1
kind: Deployment
metadata:
  name: campushub-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campushub-postgres
  template:
    metadata:
      labels:
        app: campushub-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: campushub-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: campushub-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: campushub-postgres
spec:
  selector:
    app: campushub-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
