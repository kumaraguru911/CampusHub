apiVersion: apps/v1
kind: Deployment
metadata:
  name: campushub-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campushub-grafana
  template:
    metadata:
      labels:
        app: campushub-grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: campushub-grafana-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: campushub-grafana
spec:
  selector:
    app: campushub-grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
