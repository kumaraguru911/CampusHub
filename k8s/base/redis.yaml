apiVersion: apps/v1
kind: Deployment
metadata:
  name: campushub-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campushub-redis
  template:
    metadata:
      labels:
        app: campushub-redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: campushub-redis
spec:
  selector:
    app: campushub-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
