apiVersion: apps/v1
kind: Deployment
metadata:
  name: campushub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campushub-backend
  template:
    metadata:
      labels:
        app: campushub-backend
    spec:
      containers:
        - name: backend
          image: localhost/campushub-backend:k8s-v4
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: campushub-postgres-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://campushub-redis:6379"
            - name: PROMETHEUS_URL
              value: "http://campushub-prometheus:9090"
            - name: KAFKA_BROKER
              value: "campushub-kafka:9092"

---
apiVersion: v1
kind: Service
metadata:
  name: campushub-backend
spec:
  selector:
    app: campushub-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
