apiVersion: apps/v1
kind: Deployment
metadata:
  name: campushub-mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campushub-mqtt
  template:
    metadata:
      labels:
        app: campushub-mqtt
    spec:
      containers:
        - name: mqtt
          image: docker.io/eclipse-mosquitto:2
          ports:
            - containerPort: 1883

---
apiVersion: v1
kind: Service
metadata:
  name: campushub-mqtt
spec:
  selector:
    app: campushub-mqtt
  ports:
    - port: 1883
      targetPort: 1883
  type: ClusterIP
