services:

  postgres:
    image: docker.io/library/postgres:17
    container_name: campushub-postgres
    environment:
      POSTGRES_USER: campushub
      POSTGRES_PASSWORD: campushub_dev
      POSTGRES_DB: campushub
    ports:
      - "5432:5432"
    volumes:
      - campushub-postgres-data:/var/lib/postgresql/data
    networks:
      - campushub-network

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: campushub-node-exporter
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: campushub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z
      - ./prometheus/rules:/etc/prometheus/rules:Z
    networks:
      - campushub-network

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: campushub-grafana
    ports:
      - "3000:3000"
    networks:
      - campushub-network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: campushub-redis
    ports:
      - "6379:6379"
    volumes:
      - campushub-redis-data:/data
    networks:
      - campushub-network
    command: redis-server --appendonly yes

  mqtt:
    image: docker.io/eclipse-mosquitto:2
    container_name: campushub-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:Z
      - campushub-mqtt-data:/mosquitto/data
      - campushub-mqtt-log:/mosquitto/log
    networks:
      - campushub-network
  kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: campushub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - campushub-network

networks:
  campushub-network:

volumes:
  campushub-postgres-data:
  campushub-redis-data:
  campushub-mqtt-data:
  campushub-mqtt-log:
