global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "campushub-node"
    static_configs:
      - targets:
          - "host.containers.internal:9100"

  - job_name: "campushub-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.containers.internal:8000"
